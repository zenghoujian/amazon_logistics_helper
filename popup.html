<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单搬运助手</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="container">
    <h1>订单搬运助手</h1>

    <div class="btn-row">
      <button id="btnExtract">读取亚马逊订单</button>
      <button id="btnFill">填充到物流系统</button>
    </div>

    <div class="btn-row single">
      <button id="btnClear" class="secondary">清空缓存</button>
    </div>

    <div class="config-box">
      <label for="orderPrefix"><strong>订单号前缀</strong></label>
      <div class="config-row">
        <input id="orderPrefix" type="text" placeholder="例如：AMZ- / CA- / HJ-" />
        <button id="btnSavePrefix" class="small-btn">保存</button>
      </div>
      <div class="config-tip">留空则不加前缀</div>
    </div>

    <div id="status" class="status">状态：待命</div>
    <div id="cacheSummary" class="cache-summary">当前缓存为空</div>

    <h2>预览</h2>
    <div id="previewEmpty" class="card">暂无数据</div>

    <table id="previewTable" class="preview-table hidden">
      <tr>
        <th>订单号</th>
        <td id="vOrderId"></td>
      </tr>
      <tr>
        <th>国家</th>
        <td id="vCountry"></td>
      </tr>
      <tr>
        <th>收件人</th>
        <td id="vRecipient"></td>
      </tr>
      <tr>
        <th>州</th>
        <td id="vState"></td>
      </tr>
      <tr>
        <th>城市</th>
        <td id="vCity"></td>
      </tr>
      <tr>
        <th>邮编</th>
        <td id="vPostalCode"></td>
      </tr>
      <tr>
        <th>地址</th>
        <td id="vAddress"></td>
      </tr>
      <tr>
        <th>电话</th>
        <td id="vPhone"></td>
      </tr>
      <tr>
        <th>警告</th>
        <td id="vWarnings"></td>
      </tr>
    </table>

    <h2>最近日志</h2>
    <div id="logs" class="logs"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
